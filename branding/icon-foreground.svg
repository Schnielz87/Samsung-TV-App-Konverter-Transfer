    <rect x="80" y="132" width="332" height="204" rx="16" fill="url(#screen)"/>
    <!-- App-Kacheln auf dem Bildschirm -->
    <g fill="#FFFFFF">
      <rect x="114" y="166" width="64" height="52" rx="10" opacity="0.95"/>
      <rect x="194" y="166" width="64" height="52" rx="10" opacity="0.6"/>
      <rect x="274" y="166" width="64" height="52" rx="10" opacity="0.6"/>
      <rect x="114" y="236" width="64" height="52" rx="10" opacity="0.6"/>
      <rect x="194" y="236" width="64" height="52" rx="10" opacity="0.6"/>
    </g>
