name: Build & Release

# Jeder Push baut die Windows-EXE (Installer + portable ZIP) und die Android-APK
# und hängt sie an ein GitHub-Release "v1.0.<Laufnummer>" (auf main als normales Release, sonst als Vorabversion).
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Tests (gemeinsamer Kern)
        run: gradle :core:test --console=plain
      - name: Signierschlüssel bereitstellen (falls hinterlegt)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: APK bauen
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle :android:assembleRelease --console=plain -PappVersion=$APP_VERSION -PappVersionCode=${{ github.run_number }}
          mkdir -p out && cp android/build/outputs/apk/release/*.apk out/TV-App-Transfer.apk
      - uses: actions/cache/save@v4
        with:
          path: out
          key: android-${{ github.run_id }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: EXE bauen
        shell: bash
        run: |
          gradle :desktop:packageExe :desktop:createDistributable --console=plain -PappVersion=$APP_VERSION
          mkdir -p out
          cp desktop/build/compose/binaries/main/exe/*.exe out/TV-App-Transfer-Setup.exe
          cd desktop/build/compose/binaries/main/app && 7z a -tzip ../../../../../../out/TV-App-Transfer-Portable.zip TV-App-Transfer > /dev/null
      - uses: actions/cache/save@v4
        with:
          path: out
          key: windows-${{ github.run_id }}
          enableCrossOsArchive: true

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: out
          key: android-${{ github.run_id }}
      - run: mv out android-out
      - uses: actions/cache/restore@v4
        with:
          path: out
          key: windows-${{ github.run_id }}
          enableCrossOsArchive: true
      - run: mv android-out/* out/ && ls -la out
      # Veröffentlichen wie bei Portiva/PowerIPTV: im ÖFFENTLICHEN Repo Schnielz87/Portiva-Downloads
      # (Ordner TV-App-Transfer, Tags "tv-app-transfer-v1.0.<Lauf>"). Ohne Secret DOWNLOADS_TOKEN: im eigenen Repo.
      # Die Apps prüfen beide Orte (UpdateChecker.REPOS). Feste Dateinamen nicht ändern!
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DOWNLOADS_TOKEN: ${{ secrets.DOWNLOADS_TOKEN }}
          TAG: tv-app-transfer-v${{ env.APP_VERSION }}
        run: |
          TARGET="--target ${{ github.sha }}"
          if [ -n "$DOWNLOADS_TOKEN" ]; then
            export GH_TOKEN="$DOWNLOADS_TOKEN" GH_REPO="Schnielz87/Portiva-Downloads"
            TARGET=""
          else
            echo "::warning::Secret DOWNLOADS_TOKEN fehlt – Release nur im eigenen Repo (die Update-Funktion findet es dort trotzdem)."
          fi
          cat > notes.md <<EOF
          **TV-App-Transfer** · Version $APP_VERSION · Branch \`${{ github.ref_name }}\`

          💻 **Windows-PC:** \`TV-App-Transfer-Setup.exe\` herunterladen und ausführen
          (bei der Windows-Warnung „Weitere Informationen“ → „Trotzdem ausführen“).
          Ohne Installation: \`TV-App-Transfer-Portable.zip\` entpacken und \`TV-App-Transfer.exe\` starten.

          📱 **Android-Handy/Tablet:** \`TV-App-Transfer.apk\` antippen, herunterladen, installieren.

          Bereits installiert? Beide Apps melden neue Versionen selbst („Nach Updates suchen“, automatisch alle 24 Stunden).
          Zertifikate, Geräte und Einstellungen bleiben bei Updates erhalten.

          Immer die aktuelle Version: https://github.com/Schnielz87/Portiva-Downloads/tree/main/TV-App-Transfer
          EOF
          sed -i 's/^          //' notes.md
          NEWEST=$(gh release list --limit 100 --json tagName --jq '[.[].tagName | select(startswith("tv-app-transfer-v")) | ltrimstr("tv-app-transfer-v1.0.") | tonumber] | max // 0' || echo 0)
          LATEST="--latest"
          if [ "${NEWEST:-0}" -gt "${{ github.run_number }}" ]; then LATEST="--latest=false"; fi
          if [ "$GH_REPO" = "Schnielz87/Portiva-Downloads" ]; then LATEST="--latest=false"; fi
          gh release create "$TAG" out/* $TARGET $LATEST --title "TV-App-Transfer $APP_VERSION" --notes-file notes.md

      # Ordnerseite TV-App-Transfer/README.md im Download-Repo auf die neue Version setzen
      - name: Download-Seite aktualisieren
        env:
          DOWNLOADS_TOKEN: ${{ secrets.DOWNLOADS_TOKEN }}
          V: ${{ env.APP_VERSION }}
        run: |
          if [ -z "$DOWNLOADS_TOKEN" ]; then echo "::warning::DOWNLOADS_TOKEN fehlt – Download-Seite nicht aktualisiert"; exit 0; fi
          export GH_TOKEN="$DOWNLOADS_TOKEN"
          R=Schnielz87/Portiva-Downloads
          D="https://github.com/$R/releases/download/tv-app-transfer-v$V"
          cat > page.md <<EOF
          # TV-App-Transfer

          Apps auf **Samsung-Fernseher** bringen (umwandeln, signieren, installieren) – oder APKs direkt auf einen
          **Android-TV-Stick** (Fire TV, Google TV) am Fernseher. Für Windows-PC und Android-Handy.

          ## Aktuelle Version: $V ($(date +%d.%m.%Y))

          | Gerät | Download |
          |---|---|
          | 💻 Windows-PC (Installer) | [**TV-App-Transfer-Setup.exe**]($D/TV-App-Transfer-Setup.exe) |
          | 💻 Windows-PC (ohne Installation) | [TV-App-Transfer-Portable.zip]($D/TV-App-Transfer-Portable.zip) |
          | 📱 Android-Handy/Tablet | [**TV-App-Transfer.apk**]($D/TV-App-Transfer.apk) |

          ## Installieren
          - **PC:** Setup ausführen; bei der Windows-Warnung „Weitere Informationen“ → „Trotzdem ausführen“.
          - **Handy:** APK antippen, herunterladen, installieren (einmalig „Installation aus unbekannten Quellen“ erlauben).
          - **Updates:** Beide Apps melden neue Versionen selbst („Nach Updates suchen“). Daten bleiben erhalten.

          ## Ältere Versionen
          [Alle Versionen von TV-App-Transfer](https://github.com/$R/releases?q=tv-app-transfer&expanded=true)
          EOF
          sed -i 's/^          //' page.md
          CUR=$(gh api "repos/$R/contents/TV-App-Transfer/README.md" --jq .content 2>/dev/null | base64 -d 2>/dev/null | grep -oE 'Aktuelle Version: 1\.0\.[0-9]+' | grep -oE '[0-9]+$' || true)
          if [ -n "$CUR" ] && [ "$CUR" -gt "${{ github.run_number }}" ]; then echo "::notice::Seite zeigt schon 1.0.$CUR"; exit 0; fi
          SHA=$(gh api "repos/$R/contents/TV-App-Transfer/README.md" --jq .sha 2>/dev/null || true)
          ARGS=(-f message="TV-App-Transfer: Version $V" -f content="$(base64 -w0 page.md)")
          [ -n "$SHA" ] && ARGS+=(-f sha="$SHA")
          gh api -X PUT "repos/$R/contents/TV-App-Transfer/README.md" "${ARGS[@]}" --jq .commit.sha
