name: Build & Release

# Jeder Push baut die Windows-EXE (Installer + portable ZIP) und die Android-APK
# und hängt sie an ein GitHub-Release "v1.0.<Laufnummer>" (auf main als normales Release, sonst als Vorabversion).
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Tests (gemeinsamer Kern)
        run: gradle :core:test --console=plain
      - name: Signierschlüssel bereitstellen (falls hinterlegt)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: APK bauen
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle :android:assembleRelease --console=plain -PappVersion=$APP_VERSION -PappVersionCode=${{ github.run_number }}
          mkdir -p out && cp android/build/outputs/apk/release/*.apk out/TV-App-Transfer.apk
      - uses: actions/cache/save@v4
        with:
          path: out
          key: android-${{ github.run_id }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: EXE bauen
        shell: bash
        run: |
          gradle :desktop:packageExe :desktop:createDistributable --console=plain -PappVersion=$APP_VERSION
          mkdir -p out
          cp desktop/build/compose/binaries/main/exe/*.exe out/TV-App-Transfer-Setup.exe
          cd desktop/build/compose/binaries/main/app && 7z a -tzip ../../../../../../out/TV-App-Transfer-Portable.zip TV-App-Transfer > /dev/null
      - uses: actions/cache/save@v4
        with:
          path: out
          key: windows-${{ github.run_id }}
          enableCrossOsArchive: true

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: out
          key: android-${{ github.run_id }}
      - run: mv out android-out
      - uses: actions/cache/restore@v4
        with:
          path: out
          key: windows-${{ github.run_id }}
          enableCrossOsArchive: true
      - run: mv android-out/* out/ && ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: TV-App-Transfer ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          body: |
            **Downloads**
            - `TV-App-Transfer-Setup.exe` – Windows-Installer
            - `TV-App-Transfer-Portable.zip` – Windows ohne Installation (entpacken, `TV-App-Transfer.exe` starten)
            - `TV-App-Transfer.apk` – Android-Handy/Tablet

            Anleitung: siehe README im Repository.
          files: out/*
